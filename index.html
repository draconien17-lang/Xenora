<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xenora">
<title>Xenora</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="orb" role="button" tabindex="0" aria-label="Xenora : touche la sphère pour parler ou arrêter l’écoute"></canvas>
<h1 id="name">Xenora</h1>
<div id="state" aria-live="polite">Touche pour parler</div>
<div id="text" aria-live="polite"></div>
<div class="bar">
  <input id="q" type="text" enterkeyhint="send" autocomplete="off" placeholder="Écrire à Xenora…" aria-label="Écrire à Xenora">
  <button id="send" type="button" aria-label="Envoyer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div>
<script src="script.js"></script>
</body>
</html>
